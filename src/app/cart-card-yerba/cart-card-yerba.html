
<div class="cart-item-icon" [style.background-image]="yerba.image ? 'url(' + yerba.image + ')' : '' ">

</div>
<div class="cart-item-info">
    <div class="cart-item-name">{{yerba.name}}</div>
    <div class="cart-item-weight">{{yerba.weight}} g · Sin palo</div>
</div>
<div class="cart-item-price">${{yerba.price}}</div>
@if (yerba.quantity > 1) {
    <button class="cart-action-btn cart-action-btn--decrease" type="button" (click)="decreaseItem()" aria-label="Eliminar una unidad del carrito">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="12" x2="18" y2="12"/></svg>
    </button>
}
<button class="cart-action-btn cart-action-btn--remove" type="button" (click)="removeItem()" aria-label="Eliminar el producto del carrito">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>
@if (yerba.quantity > 1) {
    <span class="cart-item-quantity"> {{ yerba.quantity }} </span>
}
