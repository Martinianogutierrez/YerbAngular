
<div class="cart-header">
    <h2>Tu Carrito</h2>
    <p> {{getTotalQuantity()}} ITEMS</p>
</div>

<div class="cart-items">
    @for (yerba of yerbaCartList; track yerba.id) {
        <!-- {{mostrar()}} -->
        <app-cart-card-yerba [yerba]="yerba" (yerbaDecreased)="onYerbaDecreased($event)" (yerbaRemoved)="onYerbaRemoved($event)" />
    }
</div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span class="cart-total-label">Total</span>
        <span class="cart-total-amount">${{ getTotalPrice() }}</span>
      </div>
      <button class="cart-checkout-btn">Finalizar Compra →</button>
    </div>
