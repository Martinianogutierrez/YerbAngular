<div class="shop-header">
    <div>
    <h2 class="shop-title">Por Martiniano Gutierrez</h2>
    <p class="shop-subtitle">SELECCIÓN ARTESANAL · TANDIL, BS AS</p>
    </div>
    <div class="carousel-nav" aria-label="Navegacion del carrusel de yerbas">
    <button
        class="carousel-btn"
        [disabled]="!canGoPrev()"
        (click)="prevSlide()"
    >
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button
        class="carousel-btn"
        [disabled]="!canGoNext()"
        (click)="nextSlide()"
    >
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    </div>
</div>

<div class="carousel-wrapper" #carouselWrapper>
    <div class="carousel-track" #carouselTrack [style.transform]="trackTransform()" [style.--visible-cards]="visibleCards()">

        @for (yerba of yerbas; track yerba.id) {
            <app-yerba-card [yerba]="yerba" (stockChange)="onStockChange($event)"></app-yerba-card>
        }

    </div>
</div>

<div class="carousel-dots" role="tablist" aria-label="Posiciones del carrusel">
    @for (slideIndex of dotIndexes(); track slideIndex; let groupIndex = $index) {
    <button
        class="dot"
        type="button"
        role="tab"
        [class.active]="currentSlide() >= slideIndex && currentSlide() < slideIndex + 3"
        [attr.aria-label]="'Ir al grupo ' + (groupIndex + 1)"
        [attr.aria-selected]="currentSlide() >= slideIndex && currentSlide() < slideIndex + 3"
        [attr.aria-current]="currentSlide() >= slideIndex && currentSlide() < slideIndex + 3 ? 'true' : null"
        (click)="slideTo(slideIndex)"
    ></button>
    }
</div>
